<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevOps CI/CD App</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 450px;
            padding: 40px;
            text-align: center;

            background: white;
            border-radius: 20px;

            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        h1 {
            color: #5a4fcf;
            margin-bottom: 15px;
        }

        .status {
            color: #22a06b;
            font-size: 20px;
            font-weight: bold;
            margin: 20px 0;
        }

        .card {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .card p {
            margin: 10px;
            font-size: 17px;
        }

        .pipeline {
            margin-top: 25px;
            font-size: 16px;
            color: #444;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            border-radius: 25px;

            background: #5a4fcf;
            color: white;
            text-decoration: none;
        }

        .button:hover {
            background: #3f36a3;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚀 Spring Boot CI/CD</h1>

    <div class="status">
        ✅ Application Running
    </div>

    <div class="card">
        <p>🎯 Spring Boot Application</p>
        <p>⚙️ Deployed through Jenkins</p>
        <p>🐳 Docker Ready</p>
        <p>☁️ DevOps Project</p>
    </div>

    <div class="pipeline">
        <p>GitHub → Jenkins → Build → Test → Deploy</p>
    </div>

    <a class="button" href="/api/hello">
        View API
    </a>

</div>

</body>
</html>
